name: Auto Locket Streak
run-name: "Locket Streak #${{ github.run_number }}"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-streak]

jobs:
  locket-streak:
    name: Locket Streak
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.API_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Lấy danh sách tài khoản từ API Cron
        id: fetch_accounts
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "Lỗi: Chưa cấu hình biến bí mật API_BASE_URL trong GitHub Secrets!"
            exit 1
          fi
          URL="${BASE_URL%/}/api/cron"
          echo "Đang kết nối lấy danh sách tài khoản từ: $URL"
          if [ -n "$CRON_SECRET" ]; then
            RESPONSE=$(curl -s --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$URL")
          else
            RESPONSE=$(curl -s --connect-timeout 10 --max-time 30 "$URL")
          fi
          echo "Kết quả API: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // true')
          if [ "$SUCCESS" = "false" ]; then
            MESSAGE=$(echo "$RESPONSE" | jq -r '.message // "Lỗi không xác định từ API"')
            echo "::error::Máy chủ API báo lỗi: $MESSAGE"
            exit 1
          fi

          UIDS=$(echo "$RESPONSE" | jq -c '.uids // []')
          echo "uids=$UIDS" >> "$GITHUB_OUTPUT"

      - name: Duy trì chuỗi từng tài khoản qua API Run
        run: |
          UID_LIST='${{ steps.fetch_accounts.outputs.uids }}'
          echo "Danh sách UIDs cần chạy: $UID_LIST"
          for uid in $(echo "$UID_LIST" | jq -r '.[]'); do
            if [ -n "$uid" ] && [ "$uid" != "null" ]; then
              echo ">>> Đang duy trì chuỗi cho UID: $uid"
              if [ -n "$CRON_SECRET" ]; then
                curl -s --connect-timeout 10 --max-time 30 -X POST "${BASE_URL%/}/api/run" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer $CRON_SECRET" \
                  -d "{\"uid\":\"$uid\"}"
              else
                curl -s --connect-timeout 10 --max-time 30 -X POST "${BASE_URL%/}/api/run" \
                  -H "Content-Type: application/json" \
                  -d "{\"uid\":\"$uid\"}"
              fi
              echo ""
              sleep 2
            fi
          done
          echo "Đã hoàn tất toàn bộ danh sách tài khoản."
